services:
  backend:
    build:
      context: ./backend

    container_name: lifeos-backend

    env_file:
      - .env

    ports:
      - "8080:8080"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080

    container_name: lifeos-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped