spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.default_schema=public
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}

lifeos.demo.enabled=${DEMO_ENABLED:false}
lifeos.demo.users=${DEMO_USERS:40}
lifeos.demo.tasks-per-user=${TASKS_PER_USER:25}
lifeos.demo.max-friends=${MAX_FRIENDS:8}
lifeos.demo.random-seed=${RANDOM_SEED:42}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:60000000}

gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

app.frontend.url=${FRONTEND_URL:http://localhost:5173}